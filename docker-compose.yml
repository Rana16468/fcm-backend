services:
  redis:
    image: redis:7-alpine
    container_name: fcm-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass mySecret123
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "mySecret123", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    container_name: fcm-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "mongodb+srv://contract_management:eIvMMRHLOP5wjaH7@cluster0.wqhd5vt.mongodb.net/fms?retryWrites=true&w=majority"
      DIRECT_URL: "mongodb+srv://contract_management:eIvMMRHLOP5wjaH7@cluster0.wqhd5vt.mongodb.net/fms?retryWrites=true&w=majority"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      REDIS_PASSWORD: "mySecret123"
      REDIS_URL: "redis://:mySecret123@redis:6379"
      NODE_ENV: "development"
      PORT: 5000
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy